name: ci

# The repo IS the marketplace: merging to main publishes instantly (consumers pull via git). So
# CI's job is to GUARD what gets published, not to publish it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SKILL_MAX_LINES: 500
  # system-design and implementation-planning carry a procedure (former commands/*.md content)
  # on top of their standard, so they get more room than a rules-only skill. See CLAUDE.md's
  # "commands are gone" note under § Structure rules.
  PROCEDURE_SKILL_MAX_LINES: 650
  PROCEDURE_SKILLS: "system-design implementation-planning"
  # Total rules across every *injected* skill's HARD-RULES fence:
  # clean-code 56 + best-practices 99 + domain-driven-design 74 + modular-monolith 95.
  EXPECTED_RULES: 324

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifests are valid JSON
        run: |
          jq . .claude-plugin/plugin.json > /dev/null
          jq . .claude-plugin/marketplace.json > /dev/null
          jq . hooks/hooks.json > /dev/null
          echo "✓ plugin.json, marketplace.json and hooks.json parse"

      - name: Plugin structure rules
        run: |
          set -euo pipefail
          fail=0

          # .claude-plugin holds ONLY the two manifests
          extra=$(find .claude-plugin -mindepth 1 -maxdepth 1 \
            ! -name plugin.json ! -name marketplace.json)
          if [ -n "$extra" ]; then
            echo "::error::.claude-plugin must contain only plugin.json and marketplace.json. Found:"
            echo "$extra"
            fail=1
          fi

          # every skill folder has a SKILL.md
          for d in skills/*/; do
            [ -e "$d" ] || continue
            if [ ! -f "${d}SKILL.md" ]; then
              echo "::error::Missing SKILL.md in ${d}"
              fail=1
            fi
          done

          # the reference/ indirection this rewrite removed must not come back
          if find skills -type d -name reference | grep -q .; then
            echo "::error::skills/*/reference/ is forbidden — SKILL.md must stay self-contained"
            fail=1
          fi

          # commands/ was removed in favour of procedure-carrying skills — see CLAUDE.md
          # § Structure rules. A stray commands/ dir means the split is drifting back.
          if [ -d commands ]; then
            echo "::error::commands/ must not exist — system-design and implementation-planning carry their own procedure now"
            fail=1
          fi

          # every marketplace source path resolves
          while read -r src; do
            if [ ! -e "$src" ]; then
              echo "::error::marketplace.json source path does not exist: ${src}"
              fail=1
            fi
          done < <(jq -r '.plugins[].source' .claude-plugin/marketplace.json)

          [ "$fail" -eq 0 ] && echo "✓ structure OK"
          exit $fail

      - name: Every skill has an intact fence, sequential rules, and fits its budget
        run: |
          set -euo pipefail
          fail=0
          for skill in skills/*/SKILL.md; do
            bad=0
            start=$(grep -n '<!-- HARD-RULES:START -->' "$skill" | cut -d: -f1 || true)
            end=$(grep -n '<!-- HARD-RULES:END -->' "$skill" | cut -d: -f1 || true)
            if [ -z "$start" ] || [ -z "$end" ]; then
              echo "::error::HARD-RULES fence markers missing from ${skill}"
              fail=1
              continue
            fi
            if [ "$start" -ge "$end" ]; then
              echo "::error::${skill}: HARD-RULES:START (${start}) must precede END (${end})"
              bad=1
            fi

            # rules must be numbered 1..N with no gaps or duplicates
            if ! sed -n "${start},${end}p" "$skill" | grep -oE '^[0-9]+' |
              awk -v s="$skill" '$1 != NR { print "::error::" s ": rule numbering breaks at " $1 \
                " (expected " NR ")"; broken = 1 } END { exit broken }'; then
              bad=1
            fi

            name=$(basename "$(dirname "$skill")")
            budget="$SKILL_MAX_LINES"
            case " $PROCEDURE_SKILLS " in
              *" $name "*) budget="$PROCEDURE_SKILL_MAX_LINES" ;;
            esac

            lines=$(wc -l < "$skill")
            if [ "$lines" -gt "$budget" ]; then
              echo "::error::${skill} is ${lines} lines, budget is ${budget}"
              bad=1
            fi

            if [ "$bad" -eq 0 ]; then
              echo "✓ ${skill}: fence ${start}–${end}, ${lines}/${budget} lines"
            else
              fail=1
            fi
          done
          exit $fail

      - name: Skills conform to the Agent Skills spec
        run: |
          set -euo pipefail
          # Constraints from the Agent Skills spec and Anthropic's authoring guide:
          #   name        — 1-64 chars, [a-z0-9-] only, no XML, no reserved word, matches its dir
          #   description — non-empty, <= 1024 chars, no XML, states what it does AND when to use it
          #   frontmatter — only the spec's six fields, so these skills also load unchanged on
          #                 claude.ai and through the API, not just in Claude Code
          # Plus this repo's own rule: a SKILL.md over 100 lines carries a Contents section, so a
          # partial read still shows its full scope.
          fail=0
          for skill in skills/*/SKILL.md; do
            dir=$(basename "$(dirname "$skill")")
            bad=0
            fm=$(awk 'NR==1 && $0=="---" { inside=1; next } inside && $0=="---" { exit } inside' "$skill")
            name=$(printf '%s\n' "$fm" | sed -n 's/^name: *//p')
            desc=$(printf '%s\n' "$fm" | sed -n 's/^description: *//p')

            if [ "$name" != "$dir" ]; then
              echo "::error::${skill}: name '${name}' must equal its directory '${dir}'"
              bad=1
            fi
            if ! printf '%s' "$name" | grep -qE '^[a-z0-9-]{1,64}$'; then
              echo "::error::${skill}: name '${name}' must be 1-64 chars of [a-z0-9-]"
              bad=1
            fi
            if printf '%s' "$name" | grep -qiE 'anthropic|claude'; then
              echo "::error::${skill}: name '${name}' contains a reserved word"
              bad=1
            fi
            if [ -z "$desc" ]; then
              echo "::error::${skill}: description is empty, or is not a single line"
              bad=1
            elif [ "${#desc}" -gt 1024 ]; then
              echo "::error::${skill}: description is ${#desc} chars, spec maximum is 1024"
              bad=1
            fi
            case "${name}${desc}" in
              *"<"*|*">"*)
                echo "::error::${skill}: name and description must not contain XML tags"
                bad=1
                ;;
            esac
            # Discovery depends on the description naming its triggers, not just its subject.
            if ! printf '%s' "$desc" | grep -q 'Use when'; then
              echo "::error::${skill}: description needs a 'Use when ...' clause for skill discovery"
              bad=1
            fi
            while read -r key; do
              case "$key" in
                name|description|allowed-tools|compatibility|license|metadata) ;;
                '') ;;
                *)
                  echo "::error::${skill}: frontmatter key '${key}' is outside the spec's six fields"
                  bad=1
                  ;;
              esac
            done < <(printf '%s\n' "$fm" | sed -n 's/^\([a-zA-Z][a-zA-Z-]*\):.*/\1/p')
            if [ "$(wc -l < "$skill")" -gt 100 ] && ! grep -qx '## Contents' "$skill"; then
              echo "::error::${skill}: over 100 lines, so it needs a '## Contents' section"
              bad=1
            fi

            if [ "$bad" -eq 0 ]; then
              echo "✓ ${skill}: spec-conformant (name, ${#desc}-char description, Contents present)"
            else
              fail=1
            fi
          done

          # Every review agent's name must match its filename, or the gate demands something absent.
          for agent in agents/*.md; do
            want=$(basename "$agent" .md)
            got=$(sed -n 's/^name: *//p' "$agent" | head -1)
            if [ "$want" != "$got" ]; then
              echo "::error::${agent}: name '${got}' must equal its filename '${want}'"
              fail=1
            fi
          done
          exit $fail

      - name: Procedure standards carry their own procedure, and only they do
        run: |
          set -euo pipefail
          # A procedure standard is one file: the fence for its rules, a '## Procedure' section below
          # it for how to run them. This replaces the old commands/*.md check — the entry point moved
          # inside the skill, so the guard has to move with it. See CLAUDE.md § Structure rules.
          fail=0
          injected=$(sed -n "/^readonly STANDARDS=(/,/^)/s/^ *'\([a-z0-9-]*\):.*/\1/p" \
            hooks/inject-hard-rules.sh)
          for name in $PROCEDURE_SKILLS; do
            skill="skills/${name}/SKILL.md"
            bad=0
            # Guards the budget lookup too: a typo here silently grants the default 500 instead.
            if [ ! -f "$skill" ]; then
              echo "::error::PROCEDURE_SKILLS names '${name}', but ${skill} does not exist"
              fail=1
              continue
            fi
            proc=$(grep -nx '## Procedure' "$skill" | cut -d: -f1 || true)
            end=$(grep -n '<!-- HARD-RULES:END -->' "$skill" | cut -d: -f1 || true)
            if [ -z "$proc" ]; then
              echo "::error::${skill}: a procedure standard needs a '## Procedure' section"
              bad=1
            elif [ -n "$end" ] && [ "$proc" -lt "$end" ]; then
              echo "::error::${skill}: '## Procedure' (${proc}) must sit below the fence (${end}), never inside it"
              bad=1
            fi
            # The Contents section is what a partial read sees, so the procedure has to appear there.
            if ! sed -n '/^## Contents$/,/^<!-- HARD-RULES:START -->/p' "$skill" | grep -q '\*\*Procedure\*\*'; then
              echo "::error::${skill}: '## Contents' must list the Procedure section"
              bad=1
            fi
            # Layer 2 only: a procedure is sequenced by invoking the skill, never by the injected card.
            case " $(printf '%s ' $injected)" in
              *" ${name} "*)
                echo "::error::${skill}: procedure standards are Layer 2 — remove '${name}' from the hook's STANDARDS array"
                bad=1
                ;;
            esac
            if [ "$bad" -eq 0 ]; then
              echo "✓ ${skill}: procedure below the fence at line ${proc}, in Contents, not injected"
            else
              fail=1
            fi
          done
          # A rules-only standard constrains code as it is written; it has no procedure to run.
          for skill in skills/*/SKILL.md; do
            name=$(basename "$(dirname "$skill")")
            case " $PROCEDURE_SKILLS " in
              *" $name "*) continue ;;
            esac
            if grep -qx '## Procedure' "$skill"; then
              echo "::error::${skill}: has a '## Procedure' section but is not in PROCEDURE_SKILLS"
              fail=1
            fi
          done
          exit $fail

      - name: Scan lists are sequential and state their own row count
        run: |
          set -euo pipefail
          # A scan list is cited by code (`G12`, `R7`), so a gap or a duplicate makes a citation
          # ambiguous — the same property CI already enforces for rules inside a fence. The row
          # count each Contents section advertises has to be the real one too: it is a claim about
          # the shipped artifact, and README repeats it (checked in the next step).
          fail=0
          for skill in skills/*/SKILL.md; do
            bad=0
            list=$(sed -n '/^## Anti-pattern scan list/,$p' "$skill")

            rows=$(printf '%s\n' "$list" |
              sed -n 's/^| *\([A-Z][A-Z]*\)\([0-9][0-9]*\) *|.*/\1 \2/p')
            count=$(printf '%s\n' "$rows" | grep -c . || true)
            if [ "$count" -eq 0 ]; then
              echo "::error::${skill}: no coded rows found under '## Anti-pattern scan list'"
              fail=1
              continue
            fi

            # Codes restart at 1 for each group prefix, so track the prefix as it changes.
            if ! printf '%s\n' "$rows" | awk -v s="$skill" '
              $1 != prefix { prefix = $1; n = 0 }
              { n++ }
              $2 != n {
                print "::error::" s ": scan-list code " $1 $2 " breaks the " prefix \
                  " sequence (expected " prefix n ")"
                broken = 1
              }
              END { exit broken }'; then
              bad=1
            fi

            # The Contents entry sits above the fence, so read only that far. The leading .* is
            # greedy on purpose: clean-code's entry says "Ch17" before its count, so a [^0-9]*
            # run would stop short of the number that actually matters.
            stated=$(sed -n '/^## Contents/,/^<!-- HARD-RULES:START -->/p' "$skill" |
              sed -n 's/.*\*\*Anti-pattern scan list\*\*.*[^0-9]\([0-9][0-9]*\) rows.*/\1/p' |
              head -1)
            if [ -z "$stated" ]; then
              echo "::error::${skill}: Contents must state its scan list's row count as 'N rows'"
              bad=1
            elif [ "$stated" -ne "$count" ]; then
              echo "::error::${skill}: Contents claims ${stated} scan-list rows, the list has ${count}"
              bad=1
            fi

            if [ "$bad" -eq 0 ]; then
              echo "✓ ${skill}: ${count} scan-list rows, sequential, count stated correctly"
            else
              fail=1
            fi
          done
          exit $fail

      - name: README's rule and scan-list counts match the skills
        run: |
          set -euo pipefail
          # README's tables are the first thing a reader trusts, and nothing regenerates them. Key
          # each row off the skill name in its first cell so the numbers cannot go stale silently.
          fail=0
          checked=0
          while IFS='|' read -r _ name rules rows _; do
            name=$(printf '%s' "$name" | tr -d ' `')
            rules=$(printf '%s' "$rules" | tr -d ' ')
            rows=$(printf '%s' "$rows" | tr -d ' ')
            skill="skills/${name}/SKILL.md"
            [ -f "$skill" ] || continue

            start=$(grep -n '<!-- HARD-RULES:START -->' "$skill" | cut -d: -f1)
            end=$(grep -n '<!-- HARD-RULES:END -->' "$skill" | cut -d: -f1)
            actual_rules=$(sed -n "${start},${end}p" "$skill" | grep -cE '^[0-9]+\. ')
            actual_rows=$(sed -n '/^## Anti-pattern scan list/,$p' "$skill" |
              grep -cE '^\| *[A-Z][A-Z]*[0-9][0-9]* *\|')

            checked=$((checked + 1))
            if [ "$rules" != "$actual_rules" ]; then
              echo "::error::README says ${name} has ${rules} rules, its fence has ${actual_rules}"
              fail=1
            fi
            if [ "$rows" != "$actual_rows" ]; then
              echo "::error::README says ${name} has ${rows} scan-list rows, it has ${actual_rows}"
              fail=1
            fi
          done < <(grep -E '^\| `[a-z-]+` \| [0-9]+ \| [0-9]+ \|' README.md)

          # Guard the guard: a reworded table would make the loop above pass vacuously.
          if [ "$checked" -ne "$(ls -d skills/*/ | wc -l)" ]; then
            echo "::error::matched ${checked} README rows, expected one per skill in skills/"
            exit 1
          fi
          [ "$fail" -eq 0 ] && echo "✓ README's counts match all ${checked} skills"
          exit $fail

      - name: References to a design section resolve against system-design's outline
        run: |
          set -euo pipefail
          # implementation-planning reads an approved design by section, and README describes it
          # doing so. Those numbers belong to system-design's document outline, which has been
          # renumbered before — so every reference carries the section's title, and this step
          # checks the pairing. A renumber that forgets one fails here instead of sending the
          # planner to the wrong section of a real design.
          outline='skills/system-design/SKILL.md'
          fail=0
          for file in skills/implementation-planning/SKILL.md README.md; do
            # References wrap across lines in prose, so flatten before matching.
            flat=$(tr '\n' ' ' < "$file" | tr -s ' ')
            pairs=$(printf '%s' "$flat" |
              grep -oE '[Ss]ections? [0-9]+ \([A-Z][^)]*\)( and [0-9]+ \([A-Z][^)]*\))?' |
              grep -oE '[0-9]+ \([A-Z][^)]*\)' || true)
            n=0
            while IFS= read -r pair; do
              [ -z "$pair" ] && continue
              num="${pair%% *}"
              title="${pair#*(}"
              title="${title%)}"
              if grep -qE "^ *${num}  +${title}( |\$)" "$outline"; then
                n=$((n + 1))
              else
                echo "::error::${file}: 'section ${num} (${title})' is not row ${num} of the outline"
                fail=1
              fi
            done <<< "$pairs"

            # A numeric reference with no title is unfalsifiable, so it is not allowed to exist.
            bare=$(printf '%s' "$flat" | grep -oE '[Ss]ections? [0-9]+[^ ]* [^(]' || true)
            if [ -n "$bare" ]; then
              echo "::error::${file}: section reference without a title: ${bare}"
              fail=1
            fi
            [ "$fail" -eq 0 ] && echo "✓ ${file}: ${n} section references resolve"
          done
          exit $fail

      - name: Rule card extracts every rule from every injected skill
        run: |
          set -euo pipefail
          chmod +x hooks/*.sh
          card=$(./hooks/inject-hard-rules.sh)
          count=$(printf '%s\n' "$card" | grep -cE '^[0-9]+\. ' || true)
          if [ "$count" -ne "$EXPECTED_RULES" ]; then
            echo "::error::card holds ${count} rules, expected ${EXPECTED_RULES}"
            exit 1
          fi
          # A silent extraction failure would still exit 0, so require every injected skill's tag.
          # The list comes from the hook's own STANDARDS array, not from skills/*/: a stack-specific
          # skill is Layer 2 only and is deliberately absent from the card. See CLAUDE.md § Layers.
          fail=0
          tags=$(sed -n "/^readonly STANDARDS=(/,/^)/s/^ *'[a-z0-9-]*:\([a-z0-9-]*\)'.*/\1/p" \
            hooks/inject-hard-rules.sh)
          # Guard the guard: if the array is ever reformatted past what that sed matches, the loop
          # below would pass vacuously. Assert we actually parsed the standards first.
          injected=$(printf '%s\n' "$tags" | grep -c . || true)
          if [ "$injected" -lt 3 ]; then
            echo "::error::parsed ${injected} tags from the STANDARDS array, expected at least 3"
            exit 1
          fi
          # Match in-shell rather than through a pipe. `printf "$card" | grep -q` is a race under
          # pipefail: grep exits on the first match, and printf — still writing a 50 KB card, which
          # is far past PIPE_BUF and so not an atomic write — takes EPIPE. pipefail then reports the
          # pipeline as failed even though the tag was found, which fails the build at random.
          for tag in $tags; do
            case "$card" in
              *"<${tag}>"*) ;;
              *)
                echo "::error::card is missing the <${tag}> block"
                fail=1
                ;;
            esac
          done
          [ "$fail" -eq 0 ] && echo "✓ card extracts ${count} rules from all ${injected} injected skills"
          exit $fail

      - name: Hooks parse and are executable
        run: |
          set -euo pipefail
          fail=0
          for h in hooks/*.sh; do
            bash -n "$h" || { echo "::error::${h} is not valid bash"; fail=1; }
            [ -x "$h" ] || { echo "::error::${h} is not executable"; fail=1; }
          done
          [ "$fail" -eq 0 ] && echo "✓ hooks parse and are executable"
          exit $fail

      - name: Hook commands point at files that exist
        run: |
          set -euo pipefail
          fail=0
          while read -r cmd; do
            path="${cmd#\$\{CLAUDE_PLUGIN_ROOT\}/}"
            [ -f "$path" ] || { echo "::error::hooks.json references missing ${path}"; fail=1; }
          done < <(jq -r '.hooks[][].hooks[].command' hooks/hooks.json)
          [ "$fail" -eq 0 ] && echo "✓ every hooks.json command resolves"
          exit $fail

      - name: Every agent the gate demands exists
        run: |
          set -euo pipefail
          chmod +x hooks/*.sh
          fail=0
          printf 'package main\n' > scratch_gate_check.go
          demand=$(./hooks/review-gate.sh 2>&1 >/dev/null || true)
          rm -f scratch_gate_check.go
          rm -rf .revai
          for agent in $(printf '%s\n' "$demand" | grep -oE '`[a-z-]+-review`' | tr -d '`' | sort -u); do
            if [ ! -f "agents/${agent}.md" ]; then
              echo "::error::gate demands \`${agent}\` but agents/${agent}.md does not exist"
              fail=1
            else
              echo "✓ gate demands ${agent}, agents/${agent}.md exists"
            fi
          done
          exit $fail

      - name: Gate is silent when only docs and config changed
        run: |
          set -euo pipefail
          chmod +x hooks/*.sh
          # Docs, plus the config files a repo actually carries: .gitignore has no extension and
          # .jsonc is not .json, so both slipped the gate's filter and demanded four code reviews
          # of a file holding no code. The dotfile rule in changed_source_files() is what fixes it.
          echo "docs only" >> README.md
          echo "# scratch" >> .gitignore
          printf '{}\n' > scratch_gate_check.jsonc
          set +e
          ./hooks/review-gate.sh
          code=$?
          set -e
          rm -f scratch_gate_check.jsonc
          rm -rf .revai
          git checkout -- README.md .gitignore
          if [ "$code" -ne 0 ]; then
            echo "::error::gate exited ${code} on a diff of only docs and config, expected 0"
            exit 1
          fi
          echo "✓ gate exits 0 on a docs-and-config diff"

      - name: Gate blocks when source files changed
        run: |
          set -euo pipefail
          chmod +x hooks/*.sh
          printf 'package main\n' > scratch_gate_check.go
          set +e
          ./hooks/review-gate.sh 2>/dev/null
          code=$?
          set -e
          rm -f scratch_gate_check.go
          rm -rf .revai
          if [ "$code" -ne 2 ]; then
            echo "::error::gate exited ${code} on a source diff, expected 2"
            exit 1
          fi
          echo "✓ gate blocks a source diff with exit 2"

      - name: Gate names ddd-review as required for a domain path
        run: |
          set -euo pipefail
          chmod +x hooks/*.sh
          mkdir -p scratch_ctx/domain
          printf 'package domain\n' > scratch_ctx/domain/order.go
          demand=$(./hooks/review-gate.sh 2>&1 >/dev/null || true)
          rm -rf scratch_ctx .revai
          # In-shell match, for the same reason as the card step above.
          case "$demand" in
            *'Required — these changed paths are domain modelling'*)
              echo "✓ gate hard-requires ddd-review for a domain/ path"
              ;;
            *)
              echo "::error::gate did not require ddd-review for a domain/ path"
              printf '%s\n' "$demand"
              exit 1
              ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Markdown lints clean
        run: npx --yes markdownlint-cli2

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: claude plugin validate
        run: claude plugin validate .
